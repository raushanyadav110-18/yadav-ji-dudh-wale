<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Yadav Ji Dudh Wale</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="overlay"></div>

    <header class="topbar">

        <div class="top-left">

            <div id="clock" class="pill">
                5:26 PM
            </div>

            <div class="pill online">
                <span></span>
                <strong id="onlineCount">0</strong>
                online
            </div>

        </div>


        <nav class="top-right">

            <a href="#about">About</a>

            <a href="https://open.spotify.com/"
               target="_blank">
                🟢 Spotify
            </a>

            <a href="https://music.youtube.com/"
               target="_blank">
                🔴 YT Music
            </a>

        </nav>

    </header>


    <main class="hero">


        <div class="brand">

            <h1>
                यादव जी<br>
                दूध वाले
            </h1>

            <p class="powered">
                YADAV JI DUDH WALE
            </p>

        </div>


        <p class="tagline">
            "Doodh aisa ki chai khud banne lage."
        </p>


        <button class="cow" id="cowSoundButton" aria-label="Play cow sound">
    🐄
</button>

<audio id="cowSound" src="sounds/buffalo.mp3"></audio>


        <section class="notice">

            <p>🥛 आज का दूध</p>

            <strong>₹60 / LITRE</strong>

            <small>
                100% Desi • 0% Bakwaas
            </small>

        </section>


        <button id="milkButton">
            🥛 DOODH LO
        </button>


        <p id="message"></p>


        <!-- MUSIC PLAYER -->

        <section class="player">

            <div class="player-info">

                <div class="album">
                    🥛
                </div>

                <div>

                    <h3 id="songTitle">
                        Dudh Ke Vyapari
                    </h3>

                    <p id="songArtist">
                        Tuntun Yadav, Shivani Singh
                    </p>

                </div>

            </div>


            <div class="player-controls">

                <button id="prevButton">
                    ⏮
                </button>

                <button id="playButton" class="play">
                    ▶
                </button>

                <button id="nextButton">
                    ⏭
                </button>

            </div>


            <audio id="audioPlayer"></audio>

        </section>


        <section class="playlist">

            <h2>
                YADAV JI KI PLAYLIST
            </h2>

            <p>
                Special songs for special customers 🥛🎧
            </p>

        </section>


    </main>


    <script type="module" src="script.js"></script>
   

</body>

</html>
